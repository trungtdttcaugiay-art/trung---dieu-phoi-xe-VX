<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Трансфер Вьет-Хо — Нячанг</title>
<meta name="description" content="">
<meta name="theme-color" content="#0369a1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230369a1'/%3E%3Cpath d='M7 20v-6l3-4h12l3 4v6' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='11' cy='21' r='2' fill='white'/%3E%3Ccircle cx='21' cy='21' r='2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans:wght@400;500;700&display=swap&subset=cyrillic,vietnamese" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#top" aria-label="Viet Xo Transfer">
      <span class="logo" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V9a2 2 0 0 1 2-2h9l5 4h2v5"/><circle cx="7.5" cy="17" r="2"/><circle cx="16.5" cy="17" r="2"/><path d="M9.5 17h5M3 16h2"/></svg>
      </span>
      <span>Việt Xô Transfer<small data-i18n="brand.sub"></small></span>
    </a>
    <nav class="main" id="nav" aria-label="Main">
      <a href="#how" data-i18n="nav.how"></a>
      <a href="#fleet" data-i18n="nav.fleet"></a>
      <a href="#book" data-i18n="nav.book"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru" aria-pressed="true">RU</button>
      <button type="button" data-lang="vi" aria-pressed="false">VI</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<main id="top">
<section class="hero">
  <div class="wrap grid">
    <div>
      <p class="eyebrow">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>
        <span data-i18n="hero.eyebrow"></span>
      </p>
      <h1 data-i18n-html="hero.h1"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="cta-row">
        <a class="btn btn-primary" href="#book" data-i18n="hero.cta1"></a>
        <a class="btn btn-ghost" href="#how" data-i18n="nav.how"></a>
      </div>
      <div class="stats">
        <div><b>4</b><span data-i18n="stat.1"></span></div>
        <div><b>RU</b><span data-i18n="stat.2"></span></div>
        <div><b>24/7</b><span data-i18n="stat.3"></span></div>
      </div>
    </div>
    <div class="van-card floaty" aria-hidden="true">
      <span class="tag" data-i18n="tag.a"></span>
      <span class="tag b" data-i18n="tag.b"></span>
      <svg viewBox="0 0 420 240" role="img" aria-label="">
        <ellipse cx="210" cy="206" rx="170" ry="12" fill="#0c4a6e" opacity=".12"/>
        <path d="M40 170V92a14 14 0 0 1 14-14h170l56 38h60a14 14 0 0 1 14 14v40z" fill="#fff" stroke="#0369a1" stroke-width="4" stroke-linejoin="round"/>
        <path d="M232 86l44 30h-44z" fill="#bae6fd" stroke="#0369a1" stroke-width="3" stroke-linejoin="round"/>
        <rect x="62" y="92" width="48" height="34" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/>
        <rect x="120" y="92" width="48" height="34" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/>
        <rect x="178" y="92" width="48" height="34" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/>
        <path d="M40 146h334" stroke="#f59e0b" stroke-width="8"/>
        <circle cx="116" cy="178" r="26" fill="#0c4a6e"/><circle cx="116" cy="178" r="11" fill="#e0f2fe"/>
        <circle cx="318" cy="178" r="26" fill="#0c4a6e"/><circle cx="318" cy="178" r="11" fill="#e0f2fe"/>
        <rect x="362" y="140" width="14" height="10" rx="3" fill="#f59e0b"/>
        <path d="M205 62c0-9 7-15 15-15 4 0 7 2 10 5 3-3 6-5 10-5 8 0 15 6 15 15 0 14-25 28-25 28s-25-14-25-28z" transform="translate(-40 -30) scale(.9)" fill="#0369a1"/>
      </svg>
    </div>
  </div>
</section>

<section class="alt" id="why">
  <div class="wrap">
    <div class="sec-head rv">
      <p class="kicker" data-i18n="why.k"></p>
      <h2 data-i18n="why.h"></h2>
      <p data-i18n="why.p"></p>
    </div>
    <div class="cards">
      <article class="card rv"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-5.2-7-11a7 7 0 0 1 14 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h3 data-i18n="why.1.h"></h3><p data-i18n="why.1.p"></p></article>
      <article class="card rv"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20a6 6 0 0 1 12 0M15 15a5 5 0 0 1 6 5"/></svg></div><h3 data-i18n="why.2.h"></h3><p data-i18n="why.2.p"></p></article>
      <article class="card rv"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.5 7.2L4 20l1-4.5A8 8 0 1 1 21 12z"/></svg></div><h3 data-i18n="why.3.h"></h3><p data-i18n="why.3.p"></p></article>
      <article class="card rv"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg></div><h3 data-i18n="why.4.h"></h3><p data-i18n="why.4.p"></p></article>
    </div>
  </div>
</section>

<section id="how">
  <div class="wrap">
    <div class="sec-head rv"><p class="kicker" data-i18n="how.k"></p><h2 data-i18n="how.h"></h2></div>
    <div class="steps">
      <div class="step rv"><h3 data-i18n="how.1.h"></h3><p data-i18n="how.1.p"></p></div>
      <div class="step rv"><h3 data-i18n="how.2.h"></h3><p data-i18n="how.2.p"></p></div>
      <div class="step rv"><h3 data-i18n="how.3.h"></h3><p data-i18n="how.3.p"></p></div>
      <div class="step rv"><h3 data-i18n="how.4.h"></h3><p data-i18n="how.4.p"></p></div>
    </div>
  </div>
</section>

<section class="alt" id="fleet">
  <div class="wrap fleet">
    <div class="rv">
      <p class="kicker" data-i18n="fleet.k"></p>
      <h2 data-i18n="fleet.h"></h2>
      <p data-i18n="fleet.p" style="color:var(--muted-fg)"></p>
      <ul class="checks">
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="fleet.1"></span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="fleet.2"></span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="fleet.3"></span></li>
        <li><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span data-i18n="fleet.4"></span></li>
      </ul>
    </div>
  </div>
</section>

<section id="book">
  <div class="wrap book">
    <div class="book-side rv">
      <p class="kicker" data-i18n="book.k"></p>
      <h2 data-i18n="book.h"></h2>
      <p data-i18n="book.p" style="color:var(--muted-fg)"></p>
    </div>
    <form class="panel rv" id="bookForm" novalidate>
      <fieldset style="border:0;padding:0;margin:0">
        <legend class="sr" data-i18n="book.k"></legend>
        <div class="seg">
          <label><input type="radio" name="kind" value="clinic" checked><span data-i18n="book.k1"></span></label>
          <label><input type="radio" name="kind" value="outside"><span data-i18n="book.k2"></span></label>
          <label><input type="radio" name="kind" value="walkin"><span data-i18n="book.k3"></span></label>
        </div>
      </fieldset>
      <div class="surcharge" id="surcharge" role="status"></div>
      <div class="fields">
        <div class="field"><label for="name" data-i18n="f.name"></label><input id="name" name="name" autocomplete="name" required><span class="msg"></span></div>
        <div class="field"><label for="phone" data-i18n="f.phone"></label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required><span class="msg"></span></div>
        <div class="field"><label for="messenger" data-i18n="f.messenger"></label><input id="messenger" name="messenger"></div>
        <div class="field"><label for="hotel" data-i18n="f.hotel"></label><input id="hotel" name="hotel" list="hotelList" autocomplete="off" data-i18n-ph="f.hotel.ph"><datalist id="hotelList"></datalist></div>
        <div class="field full"><label for="pickup" data-i18n="f.pickup"></label><input id="pickup" name="pickup" autocomplete="street-address" required><span class="msg"></span></div>
        <div class="field full"><label for="dropoff" data-i18n="f.dropoff"></label><input id="dropoff" name="dropoff"></div>
        <div class="field"><label for="pickup_at" data-i18n="f.when"></label><input id="pickup_at" name="pickup_at" type="datetime-local" required><span class="msg"></span></div>
        <div class="field"><label for="pax" data-i18n="f.pax"></label><input id="pax" name="pax" type="number" min="1" max="16" value="2" inputmode="numeric"></div>
        <div class="field"><label for="luggage" data-i18n="f.luggage"></label><input id="luggage" name="luggage" type="number" min="0" max="30" value="0" inputmode="numeric"></div>
        <div class="field full"><label for="note" data-i18n="f.note"></label><textarea id="note" name="note" maxlength="1000"></textarea></div>
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </div>
      <div class="form-foot">
        <small data-i18n="f.foot"></small>
        <button class="btn btn-primary" type="submit" id="submitBtn" data-i18n="f.submit"></button>
      </div>
      <div class="result" id="result" role="status" aria-live="polite"></div>
    </form>
  </div>
</section>

<section style="padding-top:0">
  <div class="wrap">
    <div class="contact-strip rv">
      <div><h2 data-i18n="contact.h"></h2><p data-i18n="contact.p"></p></div>
      <a class="btn btn-accent" href="#book" data-i18n="contact.btn"></a>
    </div>
  </div>
</section>
</main>

<footer><div class="wrap" data-i18n="footer"></div></footer>
<div class="sticky-cta"><a class="btn btn-accent" href="#book" data-i18n="hero.cta1"></a></div>

<script src="/js/hotels.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
